[project]
name = "gluonify-source"
version = "0.1.0"
description = "Starting point for a Python (FastAPI) service on Gluonify: notes, Charm sign-in and roles, gDown, health"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "gluonify[fastapi]==0.1.0",
    "neo4j>=5.28",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
]

[project.scripts]
gluonify-source = "gluonify_source.main:run"

# Until the SDK (gluonify, with its extra fastapi) is published on PyPI, it comes from the sibling checkout. Remove this table once `gluonify` is on PyPI
# (then `uv lock` pins it with its hashes like every other dependency).
[tool.uv.sources]
gluonify = { path = "../gluonify-plasma-python/packages/gluonify", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.11", "httpx>=0.28"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gluonify_source"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["gluonify_source"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["gluonify_source"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
